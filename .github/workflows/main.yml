name: 🤖 NormMatik Mevzuat Nöbetçi Robotu

on:
  schedule:
    # Günde 3 kez çalışır: Gece 00:30, Sabah 10:30, Öğleden Sonra 15:30
    - cron: '30 21,7,12 * * *'
  workflow_dispatch:

jobs:
  mevzuat-tara:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Mevzuat Nöbetçi Robotunu Çalıştır
        run: |
          python 07_bulut_ve_otomasyon/mevzuat_nobetci_bot.py

      - name: 💾 Tarama Sonuçlarını Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: mevzuat-tarama-raporu
          path: 07_bulut_ve_otomasyon/mevzuat_tarama_raporu.json
